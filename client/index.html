<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ProjectT – Idle RPG</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #0a0a1a;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      touch-action: none;
    }
    #loading {
      position: fixed;
      inset: 0;
      background: #0a0a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f0c040;
      font-family: 'Courier New', monospace;
      z-index: 9999;
    }
    #loading h1 {
      font-size: 2rem;
      letter-spacing: 0.2em;
      margin-bottom: 1rem;
      text-shadow: 0 0 20px #f0c040;
    }
    #loading-bar-wrapper {
      width: 300px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #f0c040, #e07020);
      transition: width 0.3s ease;
    }
    #loading-text {
      margin-top: 0.5rem;
      font-size: 0.75rem;
      color: #aaa;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>⚔ ProjectT</h1>
    <div id="loading-bar-wrapper">
      <div id="loading-bar"></div>
    </div>
    <div id="loading-text">Loading…</div>
  </div>
</body>
</html>
